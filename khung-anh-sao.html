<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghép ảnh vào khung 20 năm Ánh Sao</title>
<style>
:root{--bg:#eef5fd;--ink:#0b2a5b;--mute:#4d6a96;--card:#fff;--line:#c9daf2;--gold:#e8a91a;--blue:#1650b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1730;--ink:#eaf1ff;--mute:#9db4da;--card:#12254a;--line:#25407a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro","Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:20px 14px}
main{width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.3rem;margin:0;font-weight:700;line-height:1.3}
p.sub{margin:4px 0 0;color:var(--mute);font-size:.92rem;line-height:1.5}
.stage{position:relative;width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line);touch-action:none;cursor:grab}
.stage.drag{cursor:grabbing}
canvas{width:100%;height:100%;display:block}
.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--blue);font-weight:600;pointer-events:none;width:55%;font-size:.95rem;line-height:1.4}
.row{display:flex;gap:10px;align-items:center}
.btn{flex:1;border:0;border-radius:10px;padding:13px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--blue);color:#fff}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#2b1c00}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
label.zoom{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--mute)}
input[type=range]{flex:1;accent-color:var(--blue)}
</style></head>
<body><main>
<header><h1>Ghép ảnh của bạn vào khung kỷ niệm 20 năm</h1>
<p class="sub">Trường Chuyên biệt Ánh Sao. Chọn ảnh, kéo để căn vị trí, phóng to hoặc thu nhỏ rồi tải về.</p></header>
<div class="stage" id="stage"><canvas id="c" width="1254" height="1254"></canvas><div class="hint" id="hint">Bấm “Chọn ảnh” để thêm ảnh vào giữa khung</div></div>
<label class="zoom">Thu phóng <input type="range" id="zoom" min="1" max="4" step="0.01" value="1" disabled aria-label="Thu phóng ảnh"></label>
<div class="row">
<button class="btn" id="pick">Chọn ảnh</button>
<button class="btn gold" id="save" disabled>Tải ảnh về</button>
</div>
<input type="file" id="file" accept="image/*" hidden>
</main>

  ctx.fillStyle='#fff';ctx.fillRect(0,0,1254,1254);
  if(photo){const w=photo.width*base*s,h=photo.height*base*s;
    ctx.drawImage(photo,HOLE.x+ox-w/2,HOLE.y+oy-h/2,w,h);}
  ctx.drawImage(frame,0,0,1254,1254);
}
function clamp(){ if(!photo)return;
  const w=photo.width*base*s,h=photo.height*base*s;
  const mx=Math.max(0,(w-HOLE.r*2)/2),my=Math.max(0,(h-HOLE.r*2)/2);
  ox=Math.max(-mx,Math.min(mx,ox));oy=Math.max(-my,Math.min(my,oy));}
function load(f){
  const img=new Image();
  img.onload=()=>{photo=img;base=Math.max(HOLE.r*2/img.width,HOLE.r*2/img.height)*1.02;
    s=1;ox=oy=0;zoom.value=1;zoom.disabled=false;save.disabled=false;hint.style.display='none';draw();};
  img.src=URL.createObjectURL(f);
}
frame.onload=draw;frame.src=FRAME_SRC;
document.getElementById('pick').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>{if(e.target.files[0])load(e.target.files[0]);};
zoom.oninput=()=>{s=+zoom.value;clamp();draw();};
let last=null;const k=()=>1254/stage.clientWidth;
stage.onpointerdown=e=>{if(!photo)return;last=[e.clientX,e.clientY];stage.setPointerCapture(e.pointerId);stage.classList.add('drag');};
stage.onpointermove=e=>{if(!last)return;ox+=(e.clientX-last[0])*k();oy+=(e.clientY-last[1])*k();last=[e.clientX,e.clientY];clamp();draw();};
stage.onpointerup=stage.onpointercancel=()=>{last=null;stage.classList.remove('drag');};
stage.onwheel=e=>{if(!photo)return;e.preventDefault();s=Math.min(4,Math.max(1,s*(e.deltaY<0?1.06:.94)));zoom.value=s;clamp();draw();};
save.onclick=()=>{cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='khung-20-nam-anh-sao.png';a.click();},'image/png');};
</script></body></html>
